name: Update Version Header

on:
  push:
    branches:
      - '**'  # Run on all branches

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for pushing changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate Git metadata

      - name: Update version.h with Git metadata
        run: |
          # Get Git metadata
          GIT_HASH=$(git rev-parse HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Define the file to update
          FILE_TO_UPDATE="driver/src/global/version.h"

          # Create the file with a default template if it doesn't exist
          if [ ! -f "$FILE_TO_UPDATE" ]; then
            mkdir -p "$(dirname "$FILE_TO_UPDATE")"
            cat > "$FILE_TO_UPDATE" << EOL
#ifndef VERSION_H
#define VERSION_H

#define GIT_HASH "unknown"
#define GIT_BRANCH "unknown"
#define BUILD_DATE "unknown"

#endif // VERSION_H
EOL
          fi

          # Update the macros in version.h
          sed -i 's/#define[[:space:]]\+GIT_HASH[[:space:]]\+".*"/#define GIT_HASH "'"$GIT_HASH"'"/g' "$FILE_TO_UPDATE"
          sed -i 's/#define[[:space:]]\+GIT_BRANCH[[:space:]]\+".*"/#define GIT_BRANCH "'"$GIT_BRANCH"'"/g' "$FILE_TO_UPDATE"
          sed -i 's/#define[[:space:]]\+BUILD_DATE[[:space:]]\+".*"/#define BUILD_DATE "'"$BUILD_DATE"'"/g' "$FILE_TO_UPDATE"

          # Verify the file was updated
          if grep -q "#define GIT_HASH \"$GIT_HASH\"" "$FILE_TO_UPDATE" && \
             grep -q "#define GIT_BRANCH \"$GIT_BRANCH\"" "$FILE_TO_UPDATE" && \
             grep -q "#define BUILD_DATE \"$BUILD_DATE\"" "$FILE_TO_UPDATE"; then
            echo "Updated $FILE_TO_UPDATE with Git hash $GIT_HASH, branch $GIT_BRANCH, and build date $BUILD_DATE."
          else
            echo "Error: Failed to update $FILE_TO_UPDATE with Git metadata."
            exit 1
          fi

      - name: Commit and push changes
        run: |
          if git diff --quiet driver/src/global/version.h; then
            echo "No changes to commit"
            exit 0
          fi
          git add driver/src/global/version.h
          git commit -m "Update version.h with Git metadata [skip ci]"
          git push github HEAD
