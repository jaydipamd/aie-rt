name: Update Version Header

on:
  push:
    branches:
      - '**'  # Run on all branches

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for pushing changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate Git metadata

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version.h with Git metadata
        run: |
          # Get Git metadata
          GIT_HASH=$(git rev-parse HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Define the file to update
          FILE_TO_UPDATE="driver/src/global/version.h"

          # Debug: Check if file exists and show its content
          echo "Checking if $FILE_TO_UPDATE exists..."
          if [ -f "$FILE_TO_UPDATE" ]; then
            echo "$FILE_TO_UPDATE exists. Current content:"
            cat "$FILE_TO_UPDATE"
          else
            echo "$FILE_TO_UPDATE does not exist. Creating it..."
            mkdir -p "$(dirname "$FILE_TO_UPDATE")"
            {
              echo "#ifndef VERSION_H"
              echo "#define VERSION_H"
              echo ""
              echo "#define GIT_HASH \"unknown\""
              echo "#define GIT_BRANCH \"unknown\""
              echo "#define BUILD_DATE \"unknown\""
              echo ""
              echo "#endif // VERSION_H"
            } > "$FILE_TO_UPDATE"
            echo "Created $FILE_TO_UPDATE. Content:"
            cat "$FILE_TO_UPDATE"
          fi

          # Debug: Show Git metadata
          echo "Git metadata: HASH=$GIT_HASH, BRANCH=$GIT_BRANCH, DATE=$BUILD_DATE"

          # Update the macros in version.h
          echo "Updating $FILE_TO_UPDATE..."
          sed -i "s/#define[[:space:]]\+GIT_HASH[[:space:]]\+\".*\"/#define GIT_HASH \"$GIT_HASH\"/g" "$FILE_TO_UPDATE"
          sed -i "s/#define[[:space:]]\+GIT_BRANCH[[:space:]]\+\".*\"/#define GIT_BRANCH \"$GIT_BRANCH\"/g" "$FILE_TO_UPDATE"
          sed -i "s/#define[[:space:]]\+BUILD_DATE[[:space:]]\+\".*\"/#define BUILD_DATE \"$BUILD_DATE\"/g" "$FILE_TO_UPDATE"

          # Debug: Show file content after update
          echo "Content of $FILE_TO_UPDATE after sed:"
          cat "$FILE_TO_UPDATE"

      - name: Commit and push changes
        run: |
          git add driver/src/global/version.h
          git commit -m "Update version.h with Git metadata [skip ci]"
          git push origin HEAD
